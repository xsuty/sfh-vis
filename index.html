<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive Strict Fibonacci Heap Visualizer built with Vue.js and Cytoscape">
    <title>SFH Visualizer</title>
    <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg" type="image/svg+xml" />
    <!-- Vendor libs (globals) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" defer></script>
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js" defer></script>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="app" v-cloak>
        <!-- ===== Header ===== -->
        <div class="header-bar">
            <h1>Strict Fibonacci Heap Visualizer</h1>
            <label>
                <input type="checkbox" v-model="advancedView" />
                Advanced View
            </label>
        </div>
        <!-- ===== Status ===== -->
        <div id="status" class="status">{{ statusText }}</div>
        <!-- ===== Controls ===== -->
        <div class="controls">
            <input type="number" placeholder="New key to insert" v-model.number="inputValue" step="1" autocomplete="off" inputmode="numeric" pattern="-?\d*" />
            <button @click="insert" :disabled="!canInsert">Insert</button>
            <button @click="removeMin" :disabled="!canDeleteMin">Delete-min</button>
            <button @click="meldHeaps" :disabled="!canMeldHeaps" v-if="!mergeState.mode">Meld Heaps</button>
            <button @click="cancelMerge" v-else>Cancel Merge</button>
            <button @click="nextStep" :disabled="!stepping">Next step</button>
            <button @click="skipSteps" :disabled="!stepping">Skip steps</button>
        </div>
        <!-- ===== Heap Tabs ===== -->
        <div class="heap-tabs">
            <button v-for="(heap, index) in heaps" :key="heap._heapId" :class="['tab-btn', heapTabClasses[index]]" @click="clickHeap(index)" :disabled="stepping">
                Heap {{ heap._heapId }}
            </button>
            <button id="add-heap" @click="!stepping && !mergeState.mode && addHeap()" :disabled="heaps.length >= MAX_HEAPS || stepping || mergeState.mode">
                + New Heap
            </button>
            <button id="delete-heap" @click="!stepping && !mergeState.mode && deleteHeap(currentHeapIndex)" :disabled="stepping || mergeState.mode || heaps.length === 1">
                Delete Heap
            </button>
            <button id="export-heap" @click="exportHeap()" :disabled="!canExportHeap">
                Export Heap
            </button>
            <button id="import-heap" @click="triggerImportHeap()" :disabled="stepping || mergeState.mode">
                Import Heap
            </button>
            <input type="file" id="import-heap-file" accept=".json" @change="handleImportFile" style="display: none;" />
        </div>
        <!-- ===== Main Visualization ===== -->
        <div class="main-vis-container">
            <div id="step-log" class="step-log">
                <h3>Step Log</h3>
                <div v-for="(log, i) in stepLogs" :style="logStyles[i]">{{ log.text }}</div>
            </div>
            <div id="heap-cy"></div>
            <div id="legend" class="legend">
                <div class="legend-item">
                    <div class="legend-color red"></div> Fixed Node
                </div>
                <div class="legend-item">
                    <div class="legend-color green"></div> Free Node
                </div>
                <div class="legend-item">
                    <div class="legend-color blue"></div> Passive Node
                </div>
            </div>
        </div>
        <!-- ===== Drawer ===== -->
        <div id="heap-drawer" :class="['drawer', drawerOpen ? 'open' : '']">
            <div id="drawer-handle" class="drawer-handle"></div>
            <button class="drawer-toggle" @click="drawerOpen = !drawerOpen">
                {{ drawerOpen ? '▼ Hide Lists' : '▲ Show Lists' }}
            </button>
            <div class="drawer-content" v-show="drawerOpen">
                <div class="fix-list-toolbar">
                    <span>Collapsible sections:</span>
                    <button v-for="section in fixListSections" :key="section" @click="toggleFixListSection(section)" :class="{ collapsed: fixListCollapsedSections[section] }">
                        {{ section.replace(/^_/, '') }}
                    </button>
                </div>
                <div class="drawer-body">
                    <div class="slider-sidebar">
                        <div class="gap-control">
                            <label for="gap-slider">Fix↔Rank gap: {{ fixRankGap }}px</label>
                            <div class="vertical-slider-wrapper">
                                <input id="gap-slider" type="range" :min="FIX_RANK_GAP_MIN" :max="FIX_RANK_GAP_MAX" step="1" v-model.number="fixRankGap" class="vertical-slider" />
                            </div>
                        </div>
                    </div>
                    <div id="lists-cy" :style="listsCyStyle"></div>
                </div>
            </div>
        </div>
        <!-- ===== Node Modal ===== -->
        <div id="node-modal" class="modal" v-show="nodeModalOpen">
            <div class="modal-content">
                <span id="close-modal" class="close" @click="nodeModalOpen = false">&times;</span>
                <h3>Node Operations</h3>
                <div class="operation">
                    <label for="new-key-input">Decrease Key:</label>
                    <input id="new-key-input" type="number" placeholder="New key" v-model.number="newKeyInput" step="1" autocomplete="off" inputmode="numeric" pattern="-?\d*" />
                    <button id="confirm-decrease-key" :disabled="stepping" @click="decreaseKey(newKeyInput)">
                        Update Key
                    </button>
                </div>
                <hr />
                <div class="operation">
                    <label for="delete-node">Delete Node:</label>
                    <button id="delete-node" class="delete-btn" :disabled="stepping" @click="deleteNode()">
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Main Vue app (module entry) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
